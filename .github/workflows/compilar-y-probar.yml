# Cada vez que se suben cambios, GitHub compila YoshiSQL y corre todas las pruebas en Linux y en Windows.
# Así se sabe enseguida si algo dejó de funcionar en uno de los dos sistemas, aunque solo se haya probado en el otro.
name: Compilar y probar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compilar-y-probar:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.sistema }}
    strategy:
      # Si falla en un sistema, igual se quiere saber cómo le fue al otro
      fail-fast: false
      matrix:
        include:
          - nombre: Linux (Ubuntu)
            sistema: ubuntu-latest
          - nombre: Windows
            sistema: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar (las advertencias cuentan como errores)
        run: dotnet build YoshiSQL.sln -c Release

      - name: Correr las pruebas
        run: dotnet test YoshiSQL.sln -c Release --no-build --logger "console;verbosity=normal"

      # Comprueba que la aplicación se puede empaquetar para Linux sin errores (no la ejecuta)
      - name: Publicar para Linux
        if: runner.os == 'Linux'
        run: dotnet publish src/YoshiSQL.Escritorio -c Release -r linux-x64 --self-contained true -o salida/publicado
